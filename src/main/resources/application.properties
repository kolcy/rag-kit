# 本文件只放「不含任何真实凭据」的默认配置，它会被 git 提交。
# ⚠️ 永远不要把真实密码写在这里 —— 写进来就是一次提交泄露，改回去也删不干净历史。
# 本机开发请另建 src/main/resources/application-local.properties（已被 .gitignore 忽略），
# 在里面覆盖 datasource.password，启动时激活 local profile。

spring.application.name=rag-kit

# 注意 serverTimezone 用 Asia/Shanghai。
# 用 UTC 会让 JPA 写入的时间与本地相差 8 小时，created_at 一类的字段全部对不上。
spring.datasource.url=jdbc:mysql://localhost:3306/ragkit?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=CHANGE_ME
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

ollama.base-url=http://127.0.0.1:11434
ollama.embedding-model=bge-m3
ollama.chat-model=qwen2.5:7b
ollama.connect-timeout=5s
ollama.read-timeout=60s

# 8080 在本机常被 Steam / 其他程序占用，默认换成 8085
server.port=8085

rag.ingest.dir=./docs
